# Netlify build configuration.
#
# The app is a static Vite SPA that talks directly to Firebase from the
# browser — there is no server component, so there are no functions to
# configure. The only thing Netlify needs to do is build `dist` and fall back
# to index.html for client-side routes.
#
# Environment variables (VITE_FIREBASE_*) are read at BUILD time by Vite, so
# after changing them in the Netlify dashboard you must trigger a redeploy.

[build]
  base = "sadik-travels"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — every non-asset path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
