<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta
      name="description"
      content="Sadiq Travels — donor and monthly donation ledger. Firebase Authentication, Firestore and Realtime Database."
    />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230c1524'/%3E%3Cpath d='M24 7 10 12.4v10.8c0 8 5.7 14.5 14 17.2 8.3-2.7 14-9.2 14-17.2V12.4L24 7Z' fill='none' stroke='%23e7c46a' stroke-width='2.4'/%3E%3Cpath d='M18 30c2.5 1.5 4.7 1.9 7 .5 2.6-1.6 2.8-4.6.5-5.9-2-1.1-3.9.1-3.4 1.7' fill='none' stroke='%23e7c46a' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!-- Calligraphic display face + UI face + Bengali, all with swap so text
         is never invisible while a font downloads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Optional runtime config. Edit /config.js after a build to point the
      deployed site at a different Firebase project WITHOUT redeploying.
      Values here override the VITE_FIREBASE_* build-time env vars.
    -->
    <script src="/config.js"></script>

    <!-- Resolve the theme before first paint so there is no white flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sadik-travels.theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : 'auto'
          var dark =
            mode === 'dark' ||
            (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This ledger needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
